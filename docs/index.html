<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CKA Flashcards</title>
<style>
  :root {
    --k8s: #326ce5;
    --k8s-dark: #204080;
    --bg: #f7f8fc;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --card-bg: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header {
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    border-bottom: 2px solid var(--k8s);
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    color: var(--k8s-dark);
    letter-spacing: 0.3px;
  }
  #counter { font-size: 13px; color: var(--muted); }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #card {
    width: min(720px, 100%);
    min-height: 320px;
    background: var(--card-bg);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(32, 64, 128, 0.12);
    border: 1px solid #e5e9f2;
    padding: 28px 26px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: box-shadow 0.15s ease, transform 0.05s ease;
    user-select: none;
  }
  #card:active { transform: scale(0.997); }
  #card:hover { box-shadow: 0 8px 30px rgba(32, 64, 128, 0.18); }
  .side-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--k8s);
  }
  #front-text, #back-text {
    font-size: 19px;
    line-height: 1.55;
  }
  #back {
    border-top: 2px solid var(--k8s);
    padding-top: 16px;
  }
  #back[hidden] { display: none; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }
  #tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    background: var(--k8s);
    border-radius: 4px;
    padding: 2px 8px;
  }
  code {
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    background: #eceff4;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 0.92em;
  }
  b, strong { color: var(--k8s-dark); }
  footer {
    padding: 14px 20px;
    display: flex;
    justify-content: center;
    gap: 10px;
    border-top: 1px solid #e5e9f2;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--k8s);
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
  }
  button.secondary {
    background: #fff;
    color: var(--k8s-dark);
    border: 1px solid var(--k8s);
  }
  button:hover { filter: brightness(1.05); }
  #error {
    color: #b00020;
    text-align: center;
    padding: 20px;
    font-size: 14px;
  }
</style>
</head>
<body>
<header>
  <h1>CKA Flashcards</h1>
  <span id="counter"></span>
</header>

<main>
  <div id="card" hidden>
    <div>
      <div class="side-label">Question</div>
      <div id="front-text"></div>
    </div>
    <div id="back" hidden>
      <div class="side-label">Answer</div>
      <div id="back-text"></div>
      <div id="tags"></div>
    </div>
    <div class="hint" id="hint">tap to reveal answer</div>
  </div>
  <div id="error" hidden></div>
</main>

<footer>
  <button class="secondary" id="flip-btn">Flip</button>
  <button id="next-btn">Next card &rarr;</button>
</footer>

<script>
  var TSV_URL = "anki/cka-cards.tsv";
  var cards = [];
  var current = -1;
  var revealed = false;

  var cardEl = document.getElementById("card");
  var frontEl = document.getElementById("front-text");
  var backEl = document.getElementById("back");
  var backTextEl = document.getElementById("back-text");
  var tagsEl = document.getElementById("tags");
  var hintEl = document.getElementById("hint");
  var counterEl = document.getElementById("counter");
  var errorEl = document.getElementById("error");

  function parseTSV(text) {
    var out = [];
    var lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line || line.charAt(0) === "#") continue;
      var cols = line.split("\t");
      if (cols.length < 2) continue;
      out.push({
        front: cols[0],
        back: cols[1],
        tags: cols.length >= 3 ? cols[2] : ""
      });
    }
    return out;
  }

  function randomIndex() {
    if (cards.length <= 1) return 0;
    var idx;
    do {
      idx = Math.floor(Math.random() * cards.length);
    } while (idx === current); // avoid repeating the same card twice in a row
    return idx;
  }

  function showCard(idx) {
    current = idx;
    revealed = false;
    var c = cards[idx];
    frontEl.innerHTML = c.front;
    backTextEl.innerHTML = c.back;
    tagsEl.innerHTML = "";
    if (c.tags && c.tags.trim()) {
      var parts = c.tags.trim().split(/\s+/);
      for (var i = 0; i < parts.length; i++) {
        var span = document.createElement("span");
        span.className = "tag";
        span.textContent = parts[i];
        tagsEl.appendChild(span);
      }
    }
    backEl.hidden = true;
    hintEl.textContent = "tap to reveal answer";
    counterEl.textContent = "card " + (idx + 1) + " of " + cards.length;
  }

  function flip() {
    revealed = !revealed;
    backEl.hidden = !revealed;
    hintEl.textContent = revealed ? "tap for next, or use the buttons" : "tap to reveal answer";
  }

  function nextCard() {
    showCard(randomIndex());
  }

  cardEl.addEventListener("click", function () {
    // First tap reveals; once revealed, a tap advances to the next card.
    if (!revealed) { flip(); } else { nextCard(); }
  });
  document.getElementById("flip-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    flip();
  });
  document.getElementById("next-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    nextCard();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight" || e.key === "n") { nextCard(); }
  });

  fetch(TSV_URL)
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    })
    .then(function (text) {
      cards = parseTSV(text);
      if (!cards.length) throw new Error("no cards parsed from TSV");
      cardEl.hidden = false;
      nextCard();
    })
    .catch(function (err) {
      errorEl.hidden = false;
      errorEl.textContent =
        "Could not load cards from " + TSV_URL + " (" + err.message +
        "). Note: opening index.html directly with file:// blocks fetch. " +
        "Serve it over http (e.g. `python3 -m http.server`) or via GitHub Pages.";
    });
</script>
</body>
</html>
